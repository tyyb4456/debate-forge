services:
  postgres:
    image: postgres:17-alpine
    container_name: debate_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "tybpost@#56*"
      POSTGRES_DB: debate_ai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d debate_ai_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
